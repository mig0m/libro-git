	3- Hacer una función que sume todos los números del array y muestre el resultado en pantalla.
	4- Hacer una función que sume los números en las posiciones pares del array y reste los que están en las impares. El resultado se mostrará en pantalla.
	5- Hacer una función que muestre el primer número primo que haya en el array.
	6- Repetir el ejercicio 5 sin recorrer el array entero, si es que no se ha hecho así el ejercicio anterior.
	7- Si no se ha hecho, modificar el ejercicio 5 y 6 para que usen una función que reciba un número como parámetro y devuelva true si es primo o false si no lo es.
	
Se harán todos los ejercicios en en mismo fichero hmtl. Se creará un botón para ejecutar cada una de las funciones creadas.
-->
